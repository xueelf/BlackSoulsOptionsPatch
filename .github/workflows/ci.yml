name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build CN
        run: dotnet build src/options.csproj -c Release -p:Locale=zh

      - name: Build JP
        run: dotnet build src/options.csproj -c Release -p:Locale=ja

      - name: Build EN
        run: dotnet build src/options.csproj -c Release -p:Locale=en
