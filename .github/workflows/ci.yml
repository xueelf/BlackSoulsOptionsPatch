name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        gameGeneration: [1, 2]
        locale: [zh, ja, en]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/options.csproj -c Release -p:GameGeneration=${{ matrix.gameGeneration }} -p:Locale=${{ matrix.locale }}
