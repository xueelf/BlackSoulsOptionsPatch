name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: BlackSouls CN
            gameGeneration: 1
            locale: zh
          - name: BlackSouls JP
            gameGeneration: 1
            locale: ja
          - name: BlackSouls EN
            gameGeneration: 1
            locale: en
          - name: BlackSoulsII CN
            gameGeneration: 2
            locale: zh
          - name: BlackSoulsII JP
            gameGeneration: 2
            locale: ja
          - name: BlackSoulsII EN
            gameGeneration: 2
            locale: en
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ${{ matrix.name }}
        run: dotnet build src/options.csproj -c Release -p:GameGeneration=${{ matrix.gameGeneration }} -p:Locale=${{ matrix.locale }}
