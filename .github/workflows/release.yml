name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: bash
        run: bash scripts/build.sh

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "release/BlackSouls-Options-CN.exe" \
            "release/BlackSouls-Options-JP.exe" \
            "release/BlackSouls-Options-EN.exe" \
            "release/BlackSoulsII-Options-CN.exe" \
            "release/BlackSoulsII-Options-JP.exe" \
            "release/BlackSoulsII-Options-EN.exe"
